apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: postgres-gitops-app
  namespace: argocd

spec:
  project: default
  source:
    repoURL: 'https://github.com/khushi08-yadav/postgres-k8s.git'
    targetRevision: HEAD
    path: '.'

  destination:
    server: 'https://default.svc'
    namespace: postgresql

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
