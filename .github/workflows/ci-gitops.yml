name: ArgoCD Sync Workflow

on:
  push:
    branches:
      - main

jobs:
  test-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.12.0'

      - name: Check Helm Chart
        run: helm lint .
